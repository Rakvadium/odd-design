schemaVersion = 24
# Pinned NVDA settings for sr.ts. Every run copies this into a fresh config dir, so a run never
# reads or changes the user's own NVDA settings. Change a setting here, not in NVDA's dialogs.
[general]
	language = en
	showWelcomeDialogAtStartup = False
	askToExit = False
	playStartAndExitSounds = False
	saveConfigurationOnExit = False
[update]
	autoCheck = False
	startupNotification = False
	allowUsageStats = False
	askedAllowUsageStats = True
[speech]
	synth = oneCore
	# "some": NVDA's default punctuation level.
	symbolLevel = 100
	[[oneCore]]
		voice = HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Speech_OneCore\Voices\Tokens\MSTTS_V110_enUS_DavidM
		rate = 50
		pitch = 50
		volume = 100
		capPitchChange = 30
		sayCapForCapitals = False
		beepForCapitals = False
[virtualBuffers]
	# Off so a page load doesn't read the whole story aloud. Scenarios start from a known focus instead.
	autoSayAllOnPageLoad = False
[braille]
	display = noBraille
[development]
	# Loads globalPlugins/odd_verify.py from the scratchpad dir.
	enableScratchpadDir = True
