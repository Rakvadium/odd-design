<!-- expect: none -->
<div class="odd-field">
  <label class="odd-label" for="email">Email</label>
  <input class="odd-input" id="email" type="email" required aria-invalid="true" aria-describedby="email-hint email-error">
  <p class="odd-hint" id="email-hint">We never share it.</p>
  <p class="odd-error" id="email-error">Enter an email address.</p>
</div>
<div class="odd-field">
  <label class="odd-label" for="notes">Notes</label>
  <textarea class="odd-textarea" id="notes"></textarea>
</div>
<div class="odd-field">
  <label class="odd-label" for="format">Format</label>
  <select class="odd-select" id="format"><option>Standard</option></select>
</div>
